[run]
version = "shell_v1"
output_dir = "./outputs/cnp"
seed = 42
device = "auto"  # "auto", "cuda", or "cpu"

[training]
epochs = 15
steps_per_epoch = 1000
batch_size = 1200
# validation_batch_size = 300
use_full_epochs = false  # false = randomly sampled batches, true = one full pass through data per epoch
monitor_every = 1000

[context]
ratio = 0.3333333333333333
mode = "random"  # "random" or "fixed" 
inference_size = 4096  # Number of events saved as the portable inference context

[model]
representation_dim = 32
hidden_dim = 128
dropout = 0.10

[optimizer]
learning_rate = 1.0e-4
weight_decay = 0.0