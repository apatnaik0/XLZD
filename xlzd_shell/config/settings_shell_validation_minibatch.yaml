cnp_settings:
  training_mode: minibatch
  training_epochs: 15
  steps_per_epoch: 5000
  context_ratio: 0.3333333
  context_is_subset: true
  batch_size_train: 12000
  files_per_batch_train: 32
  number_of_walkers: 1
  config_wise: false
  ratio_testing_vs_training: 1/10
  plot_after: 5000
simulation_settings:
  simulation_type: shell
  R_max: 1490.0
  Z_max: 1983.0
  n_shells: 100
  scale_power: 0.3333333333333333
  theta_headers:
  - R_shell
  - Z_shell
  phi_labels:
  - s_r
  - s_z_from_center
  target_headers:
  - target_shell
  lf_cost: 1
  hf_cost: 10
  negative_shells: 4
path_settings:
  version: xlzd_shell_v1_minibatch
  path_to_files_train: ../../shell_outputs/training/lf
  path_to_files_predict:
  - ../../shell_outputs/validation/hf
  iteration:
  - 0
  fidelity:
  - 1
  path_out_cnp: ../../data/out/cnp
  path_out_mfgp: ../../data/out/mfgp
  path_out_pce: ../../data/out/pce
